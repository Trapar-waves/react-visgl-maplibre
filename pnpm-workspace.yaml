
minimumReleaseAge: 0
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExcludePrune: true
trustPolicyExclude:
  - semver

shellEmulator: true

allowBuilds:
  "@vaadin/vaadin-usage-statistics": false
  core-js: true

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - "@vaadin/vaadin-usage-statistics"
  - core-js


